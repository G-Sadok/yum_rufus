<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif">
  <rect width="1440" height="900" fill="#000000"/>

  <!-- Colonne webtoon -->
  <rect x="490" y="0" width="460" height="900" fill="#1A1A1C"/>
  <line x1="490" y1="0" x2="490" y2="900" stroke="#2E2E32"/>
  <line x1="950" y1="0" x2="950" y2="900" stroke="#2E2E32"/>

  <line x1="490" y1="150" x2="950" y2="150" stroke="#2E2E32" stroke-dasharray="6 6"/>
  <line x1="490" y1="420" x2="950" y2="420" stroke="#2E2E32" stroke-dasharray="6 6"/>
  <line x1="490" y1="690" x2="950" y2="690" stroke="#2E2E32" stroke-dasharray="6 6"/>

  <text x="720" y="90" fill="#3A3A3E" font-size="13" text-anchor="middle">Tuile 1  hauteur 2048 px maxi</text>
  <text x="720" y="290" fill="#3A3A3E" font-size="13" text-anchor="middle">Tuile 2</text>
  <text x="720" y="560" fill="#3A3A3E" font-size="13" text-anchor="middle">Tuile 3</text>
  <text x="720" y="800" fill="#3A3A3E" font-size="13" text-anchor="middle">Tuile 4  prechargee</text>

  <!-- Barre superieure -->
  <rect x="0" y="0" width="1440" height="72" fill="#131315" opacity="0.94"/>
  <path d="M40 30 L28 40 L40 50" stroke="#F2F2F7" stroke-width="2" fill="none"/>
  <text x="64" y="34" fill="#F2F2F7" font-size="15" font-weight="600">Titre du manhwa</text>
  <text x="64" y="54" fill="#8E8E93" font-size="12">Chapitre 118  defilement vertical</text>

  <!-- Barre inferieure -->
  <rect x="0" y="820" width="1440" height="64" fill="#131315" opacity="0.94"/>
  <text x="40" y="858" fill="#F2F2F7" font-size="13">38 %</text>
  <rect x="120" y="850" width="1120" height="4" rx="2" fill="#3A3A3E"/>
  <rect x="120" y="850" width="426" height="4" rx="2" fill="#0A84FF"/>
  <text x="1300" y="858" fill="#0A84FF" font-size="13">Chapitre suivant</text>

  <!-- Annotations -->
  <g font-size="12" fill="#0A84FF">
    <line x1="960" y1="150" x2="1040" y2="150" stroke="#0A84FF" stroke-dasharray="3 3"/>
    <text x="1052" y="154">Decoupage obligatoire des images longues en tuiles</text>
    <text x="1052" y="174" fill="#6E6E73">La limite de texture Metal est de 16384 px, au dela le rendu echoue</text>
    <line x1="960" y1="420" x2="1040" y2="420" stroke="#0A84FF" stroke-dasharray="3 3"/>
    <text x="1052" y="424">Recyclage des tuiles hors ecran, budget memoire fixe</text>
    <line x1="480" y1="690" x2="400" y2="690" stroke="#0A84FF" stroke-dasharray="3 3"/>
    <text x="388" y="694" text-anchor="end">Enchainement continu vers le chapitre suivant sans quitter le lecteur</text>
  </g>

  <g font-size="11" fill="#6E6E73">
    <text x="60" y="200">Largeur de colonne reglable</text>
    <text x="60" y="220">Ajustee, pleine largeur, ou</text>
    <text x="60" y="240">valeur libre entre 40 et 100 %</text>
    <text x="60" y="276">Espacement entre pages</text>
    <text x="60" y="296">reglable de 0 a 24 px</text>
    <text x="60" y="332">Aucune animation de</text>
    <text x="60" y="352">transition dans ce mode</text>
  </g>
</svg>
