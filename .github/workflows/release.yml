name: Publication

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier, par exemple 1.0.0"
        required: true

permissions:
  contents: write

# Deux publications simultanees de la meme etiquette se disputeraient le meme
# nom de release et le meme trousseau de signature. La seconde attend.
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    name: Construire et publier le DMG
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          # L historique complet est indispensable : les notes de version se
          # redigent depuis les commits accumules depuis l etiquette
          # precedente, et un clone superficiel n en voit aucun.
          fetch-depth: 0

      - name: Determiner la version
        id: version
        env:
          # La version demandee passe par l environnement et non par une
          # interpolation dans le corps du script. Une valeur choisie par
          # l appelant qui atterrit telle quelle dans un shell est une injection
          # de commande, meme quand l appelant a le droit d ecrire dans le depot.
          VERSION_DEMANDEE: ${{ github.event.inputs.version }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" = "workflow_dispatch" ]; then
            VERSION="$VERSION_DEMANDEE"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version $VERSION non conforme au versionnage semantique."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "etiquette=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version a publier : $VERSION"

      # Les tests d abord. Notariser puis decouvrir que la redaction des notes
      # casse, c est une heure perdue et une etiquette a reposer.
      - name: Verifier les chaines d empaquetage et de publication
        run: |
          chmod +x scripts/*.sh
          ./scripts/tests-publication.sh
          ./scripts/build-dmg.sh --tests

      - name: Selectionner Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Installer le certificat de signature
        env:
          CERTIFICAT_P12: ${{ secrets.CERTIFICAT_P12_BASE64 }}
          MOT_DE_PASSE_P12: ${{ secrets.MOT_DE_PASSE_P12 }}
          MOT_DE_PASSE_TROUSSEAU: ${{ secrets.MOT_DE_PASSE_TROUSSEAU }}
        run: |
          CHEMIN_P12="$RUNNER_TEMP/certificat.p12"
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"

          echo -n "$CERTIFICAT_P12" | base64 --decode -o "$CHEMIN_P12"

          security create-keychain -p "$MOT_DE_PASSE_TROUSSEAU" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MOT_DE_PASSE_TROUSSEAU" "$TROUSSEAU"

          security import "$CHEMIN_P12" \
            -P "$MOT_DE_PASSE_P12" \
            -A -t cert -f pkcs12 \
            -k "$TROUSSEAU"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$MOT_DE_PASSE_TROUSSEAU" \
            "$TROUSSEAU"

          security list-keychain -d user -s "$TROUSSEAU"
          rm -f "$CHEMIN_P12"

      - name: Enregistrer le profil de notarisation
        env:
          IDENTIFIANT_APPLE: ${{ secrets.IDENTIFIANT_APPLE }}
          EQUIPE_APPLE: ${{ secrets.EQUIPE_APPLE }}
          MOT_DE_PASSE_APPLICATION: ${{ secrets.MOT_DE_PASSE_APPLICATION }}
        run: |
          xcrun notarytool store-credentials "notarisation-ci" \
            --apple-id "$IDENTIFIANT_APPLE" \
            --team-id "$EQUIPE_APPLE" \
            --password "$MOT_DE_PASSE_APPLICATION"

      # build-dmg.sh impose MARKETING_VERSION a l archivage depuis la version
      # recue. Le numero affiche par l application correspond donc a
      # l etiquette par construction, sans controle a rajouter.
      - name: Construire le DMG
        env:
          IDENTITE_SIGNATURE: ${{ secrets.IDENTITE_SIGNATURE }}
          EQUIPE_APPLE: ${{ secrets.EQUIPE_APPLE }}
          PROFIL_NOTARISATION: notarisation-ci
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-dmg.sh "$VERSION"

      # La redaction vit dans scripts/notes-de-version.sh, couvert par
      # scripts/tests-publication.sh. Ecrite ici, elle ne s executerait pour la
      # premiere fois qu au moment de publier, ce qui est le pire moment pour
      # decouvrir qu elle est fausse.
      - name: Rediger les notes de version
        env:
          ETIQUETTE: ${{ steps.version.outputs.etiquette }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/notes-de-version.sh \
            "$ETIQUETTE" \
            "build/Yum-$VERSION.dmg.sha256" > notes-de-version.md
          cat notes-de-version.md

      - name: Creer la release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ steps.version.outputs.etiquette }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$ETIQUETTE" \
            --title "Version $VERSION" \
            --notes-file notes-de-version.md \
            --draft \
            "build/Yum-$VERSION.dmg" \
            "build/Yum-$VERSION.dmg.sha256"

      - name: Archiver les artefacts de construction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artefacts-publication
          path: |
            build/*.dmg
            build/*.sha256
            notes-de-version.md
          retention-days: 30

      - name: Nettoyer le trousseau
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signature.keychain-db" || true

      - name: Rappel de validation manuelle
        run: |
          cat <<'FIN'

          ===================================================================
          RELEASE CREEE EN BROUILLON
          ===================================================================
          Elle n est pas encore publique. Avant de publier :

            1. Telecharge le DMG depuis la page de la release
            2. Teste le sur une machine qui n a jamais vu le projet
            3. Verifie la somme SHA 256
            4. Relis les notes de version
            5. Publie depuis l interface GitHub

          ===================================================================
          FIN
