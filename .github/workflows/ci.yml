name: Integration continue

on:
  push:
    branches: [dev, 'feat/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Verifications
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Selectionner Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Installer les outils
        run: |
          brew install swiftlint swiftformat jq

      - name: Mettre en cache les dependances Swift
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: swift-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: swift-${{ runner.os }}-

      - name: Verifier l absence de tiret cadratin
        run: |
          # Motif construit en octal. Le bash livre par macOS est un 3.2 qui
          # n interprete pas l echappee unicode, le motif se reduisait alors au
          # mot du code du caractere et le controle ne detectait rien.
          TIRET_CADRATIN=$(printf '\342\200\224')
          TROUVES=$(grep -rIln -e "$TIRET_CADRATIN" \
            --include='*.swift' --include='*.md' --include='*.json' \
            --include='*.yml' --include='*.yaml' --include='*.sh' \
            --include='*.strings' --include='*.xcstrings' \
            . 2>/dev/null | grep -v '.git/' || true)
          if [ -n "$TROUVES" ]; then
            echo "Regle de redaction enfreinte, tiret cadratin trouve dans :"
            echo "$TROUVES"
            exit 1
          fi
          echo "Aucun tiret cadratin."

      - name: Lancer le jeu de verifications du projet
        run: |
          chmod +x scripts/*.sh
          ./scripts/verifications.sh

      # Le dossier App existe des l etape 0, mais son projet Xcode n arrive
      # qu avec la coquille de l application. Sans cette detection, les etapes
      # xcodebuild echouent sur un schema inexistant alors que rien n est casse.
      - name: Detecter le projet Xcode
        id: detection
        run: |
          PROJET=$(find App -maxdepth 2 \
            \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print -quit 2>/dev/null || true)
          if [ -n "$PROJET" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Projet Xcode detecte : $PROJET"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pas encore de projet Xcode, la couche metier est couverte par verifications.sh."
          fi

      - name: Compiler pour macOS
        if: steps.detection.outputs.present == 'true'
        run: |
          xcodebuild build \
            -scheme Yum \
            -destination 'platform=macOS' \
            -configuration Debug \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Compiler pour iOS
        if: steps.detection.outputs.present == 'true'
        run: |
          xcodebuild build \
            -scheme Yum \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Lancer les tests
        if: steps.detection.outputs.present == 'true'
        run: |
          xcodebuild test \
            -scheme Yum \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Publier les resultats de test
        if: always() && steps.detection.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resultats-de-test
          path: TestResults.xcresult
          retention-days: 7

  # La chaine d empaquetage. Elle tourne sur toutes les branches, sans
  # certificat ni identifiants Apple, parce que la moitie verifiable de cette
  # chaine l est sans eux : le contenu du DMG, l ordre des douze etapes, le
  # refus des constructions non publiables et la somme de controle.
  #
  # Le verdict reel de Gatekeeper, lui, demande un certificat Developer ID et
  # un aller retour chez Apple. Il vit dans la chaine de publication, declenchee
  # par une etiquette de version, et nulle part ailleurs.
  empaquetage:
    name: Chaine d empaquetage
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Selectionner Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Verifier la chaine d empaquetage
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-dmg.sh --tests

      # La chaine de publication se verifie sur toutes les branches, elle
      # aussi. Attendre l etiquette pour decouvrir qu elle est cassee coute une
      # etiquette a reposer et une release a supprimer.
      - name: Verifier la chaine de publication
        run: ./scripts/build-dmg.sh --tests-publication

  # Les sept budgets de la section 12. Ce travail est bloquant, sur toutes les
  # branches, et sans repli silencieux : une etape qui sortirait en zero parce
  # qu un outil manque rendrait la chaine verte sans avoir rien mesure, ce qui
  # est exactement ce que la section 14 interdit.
  #
  # Il est separe des verifications pour que la generation du corpus de 200000
  # chapitres ne rallonge pas le retour du travail principal, et il tourne sur
  # sa propre machine pour que rien d autre ne perturbe les deux budgets
  # memoire.
  performance:
    name: Budgets de performance
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Selectionner Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Mettre en cache les dependances Swift
        uses: actions/cache@v4
        with:
          path: Packages/.build
          key: budgets-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: budgets-${{ runner.os }}-

      - name: Generer le corpus de 5000 series et 200000 chapitres
        run: |
          chmod +x scripts/*.sh
          ./scripts/generer-jeu-de-test.sh

      - name: Mesurer les sept budgets de la section 12
        run: ./scripts/budgets-performance.sh
